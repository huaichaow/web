ursor:pointer;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.img-grid button:hover,.img-grid select:hover{background:var(--hover-color)}.img-grid input[type=color]{min-width:0;height:var(--widget-height);cursor:pointer;background:0 0;border:0;flex:1;padding:0}.img-grid :disabled{opacity:.35;cursor:not-allowed}#drop{pointer-events:none;opacity:0;color:#3a3329;letter-spacing:.04em;background:#f3eee2b3;border:2px dashed #3c322373;border-radius:14px;place-items:center;font-size:15px;transition:opacity .2s;display:grid;position:fixed;inset:10px}#drop.on{opacity:1}</style>
